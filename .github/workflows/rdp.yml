name: RDP Server
on:
  workflow_dispatch:
    inputs:
      os_version:
        description: "Choose OS / Stack"
        required: true
        default: "windows"
        type: choice
        options:
          - "windows"
          - "linux"
          - "dev_stack"
          - "hacker_stack"
permissions:
  issues: write
  contents: read
jobs:
  deploy:
    runs-on: ${{ inputs.os_version == 'linux' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 360
    steps:
      - name: Configure Environment (Windows)
        if: inputs.os_version != 'linux'
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force
          Remove-Item -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\RCM\Certificate" -Force -ErrorAction SilentlyContinue
          netsh advfirewall set allprofiles state off
          
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace "PasswordComplexity = 1", "PasswordComplexity = 0" | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item -Force C:\secpol.cfg
          
          $user = "yuta"
          $pass = "Yuta@321"
          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) { 
              New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -PasswordNeverExpires 
          } else { 
              Set-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) 
          }
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue
          Start-Service TermService -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 10

      - name: Setup ngrok (Windows)
        if: inputs.os_version != 'linux'
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force
          
          $tokens = @("${{ secrets.NGROK_TOKEN_1 }}", "${{ secrets.NGROK_TOKEN_2 }}", "${{ secrets.NGROK_TOKEN_3 }}", "${{ secrets.NGROK_TOKEN_4 }}", "${{ secrets.NGROK_TOKEN_5 }}", "${{ secrets.NGROK_TOKEN_6 }}", "${{ secrets.NGROK_TOKEN_7 }}")
          $tunnel = ""
          foreach ($t in $tokens) {
            if ([string]::IsNullOrWhiteSpace($t)) { continue }
            .\ngrok.exe config add-authtoken $t
            Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -NoNewWindow -RedirectStandardOutput "ngrok.log"
            Start-Sleep -Seconds 10
            try {
              $info = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
              if ($info.tunnels) {
                $tunnel = $info.tunnels[0].public_url -replace "tcp://", ""
                break
              }
            } catch { }
            Stop-Process -Name "ngrok" -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }
          if ([string]::IsNullOrWhiteSpace($tunnel)) { exit 1 }
          echo "TUNNEL_URL=$tunnel" >> $env:GITHUB_ENV

      - name: Configure Environment (Linux)
        if: inputs.os_version == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies tightvncserver curl unzip jq
          sudo useradd -m -s /bin/bash yuta || true
          echo "yuta:Yuta@321" | sudo chpasswd
          sudo adduser yuta sudo || true
          echo "yuta ALL=(ALL) NOPASSWD:ALL" | sudo tee -a /etc/sudoers
          sudo -u yuta bash -c "mkdir -p ~/.vnc && echo 'Yuta@321' | vncpasswd -f > ~/.vnc/passwd && chmod 600 ~/.vnc/passwd"
          sudo -u yuta bash -c "vncserver :1 -geometry 1280x720 -depth 24"
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Setup ngrok (Linux)
        if: inputs.os_version == 'linux'
        shell: bash
        run: |
          tokens=("${{ secrets.NGROK_TOKEN_1 }}" "${{ secrets.NGROK_TOKEN_2 }}" "${{ secrets.NGROK_TOKEN_3 }}" "${{ secrets.NGROK_TOKEN_4 }}" "${{ secrets.NGROK_TOKEN_5 }}" "${{ secrets.NGROK_TOKEN_6 }}" "${{ secrets.NGROK_TOKEN_7 }}")
          TUNNEL=""
          for t in "${tokens[@]}"; do
            if [ -z "$t" ]; then continue; fi
            ngrok config add-authtoken $t
            ngrok tcp 5901 --log=stdout > ngrok.log 2>&1 &
            NGROK_PID=$!
            sleep 10
            TUNNEL_INFO=$(curl -s http://127.0.0.1:4040/api/tunnels)
            TUNNEL=$(echo $TUNNEL_INFO | jq -r '.tunnels[0].public_url // empty')
            if [ -n "$TUNNEL" ] && [ "$TUNNEL" != "null" ]; then
              TUNNEL=$(echo $TUNNEL | sed 's|tcp://||')
              echo "TUNNEL_URL=$TUNNEL" >> $GITHUB_ENV
              break
            else
              kill $NGROK_PID
              sleep 2
            fi
          done
          if [ -z "$TUNNEL" ]; then exit 1; fi

      - name: Post to Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ inputs.os_version }}" != "linux" ]; then TYPE="windows"; else TYPE="linux"; fi
          HOST=$(echo ${{ env.TUNNEL_URL }} | cut -d':' -f1)
          PORT=$(echo ${{ env.TUNNEL_URL }} | cut -d':' -f2)
          BODY=$(printf "===START_DATA===\\nHOST=%s\\nPORT=%s\\nUSER=yuta\\nPASS=Yuta@321\\nTYPE=%s\\n===END_DATA===" "$HOST" "$PORT" "$TYPE")
          BODY_JSON=$(jq -n --arg body "$BODY" '{body: $body}')
          ISSUE_TITLE="Server-$GITHUB_RUN_ID"
          ISSUE_JSON=$(jq -n --arg title "$ISSUE_TITLE" '{title: $title, body: "Logs"}')
          ISSUE_RESPONSE=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d "$ISSUE_JSON" "https://api.github.com/repos/${{ github.repository }}/issues")
          ISSUE_NUMBER=$(echo $ISSUE_RESPONSE | jq -r '.number')
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d "$BODY_JSON" "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments"

      - name: Keep Alive
        shell: bash
        run: sleep 21600
