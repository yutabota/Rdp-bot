- name: Setup ngrok and Get URL
  shell: bash
  run: |
    # 1. تنزيل ngrok وفك الضغط بأوامر bash
    curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -o ngrok.zip
    unzip -o ngrok.zip -d ngrok

    # 2. تحديد الملف التنفيذي
    if [ "${{ inputs.os_version }}" != "linux" ]; then
      NGROK_BIN="./ngrok/ngrok.exe"
    else
      NGROK_BIN="./ngrok"
    fi

    # 3. تجربة المفاتيح حتى ينجح أحدها
    tokens=("${{ secrets.NGROK_TOKEN_1 }}" "${{ secrets.NGROK_TOKEN_2 }}" "${{ secrets.NGROK_TOKEN_3 }}" "${{ secrets.NGROK_TOKEN_4 }}" "${{ secrets.NGROK_TOKEN_5 }}" "${{ secrets.NGROK_TOKEN_6 }}" "${{ secrets.NGROK_TOKEN_7 }}")
    
    for t in "${tokens[@]}"; do
      if [ -z "$t" ]; then continue; fi
      echo "Trying token: ${t:0:5}..."
      $NGROK_BIN config add-authtoken $t
      $NGROK_BIN tcp 127.0.0.1:3389 --log=stdout > ngrok.log &
      NGROK_PID=$!
      sleep 6
      URL=$(grep -oP 'tcp://[^ ]+' ngrok.log | head -n 1 | sed 's|tcp://||')
      if [ -n "$URL" ]; then
        echo "SUCCESS! URL: $URL"
        echo "TUNNEL_URL=$URL" >> $GITHUB_ENV
        break
      else
        echo "Token is full. Trying next token..."
        kill $NGROK_PID
      fi
    done

    # 4. التحقق من النجاح
    if [ -z "$TUNNEL_URL" ]; then
      echo "All tokens are full!"
      exit 1
    fi
