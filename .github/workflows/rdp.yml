name: RDP Server
on:
  workflow_dispatch:
    inputs:
      os_version:
        description: "Choose OS / Stack"
        required: true
        default: "windows"
        type: choice
        options:
          - "windows"
          - "linux"
          - "dev_stack"
          - "hacker_stack"
permissions:
  issues: write
  contents: read
jobs:
  deploy:
    runs-on: ${{ inputs.os_version == 'linux' && 'ubuntu-latest' || 'windows-latest' }}
    timeout-minutes: 360
    steps:
      - name: Configure Environment (Windows)
        if: inputs.os_version != 'linux'
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force
          netsh advfirewall set allprofiles state off
          
          secedit /export /cfg C:\secpol.cfg
          (Get-Content C:\secpol.cfg) -replace "PasswordComplexity = 1", "PasswordComplexity = 0" | Set-Content C:\secpol.cfg
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY
          Remove-Item -Force C:\secpol.cfg
          
          $user = "yuta"
          $pass = "Yuta@321"
          if (-not (Get-LocalUser -Name $user -ErrorAction SilentlyContinue)) { 
              New-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) -PasswordNeverExpires 
          } else { 
              Set-LocalUser -Name $user -Password (ConvertTo-SecureString $pass -AsPlainText -Force) 
          }
          Add-LocalGroupMember -Group "Administrators" -Member $user -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $user -ErrorAction SilentlyContinue

      # استخدام Bash هنا يضمن بقاء العملية حية ولا يقتلها GitHub
      - name: Start ngrok and Keep Alive (Windows)
        if: inputs.os_version != 'linux'
        shell: bash
        run: |
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -o ngrok.zip
          unzip -o ngrok.zip -d .
          
          ./ngrok.exe config add-authtoken "3LVg7kzG0ZnbZ577YdVxcFAUDhY_5uMkowqVV9hRLyftvb1Ek"
          
          # تشغيل النفق في الخلفية
          ./ngrok.exe tcp 3389 --region eu --log=stdout > ngrok.log 2>&1 &
          NGROK_PID=$!
          
          sleep 10
          
          # استخراج الرابط
          TUNNEL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url // empty')
          TUNNEL=$(echo $TUNNEL | sed 's|tcp://||')
          
          if [ -z "$TUNNEL" ]; then exit 1; fi
          
          HOST=$(echo $TUNNEL | cut -d':' -f1)
          PORT=$(echo $TUNNEL | cut -d':' -f2)
          
          # إرسال البيانات للبوت
          BODY=$(printf "===START_DATA===\\nHOST=%s\\nPORT=%s\\nUSER=yuta\\nPASS=Yuta@321\\nTYPE=windows\\n===END_DATA===" "$HOST" "$PORT")
          BODY_JSON=$(jq -n --arg body "$BODY" '{body: $body}')
          ISSUE_TITLE="Server-$GITHUB_RUN_ID"
          ISSUE_JSON=$(jq -n --arg title "$ISSUE_TITLE" '{title: $title, body: "Logs"}')
          ISSUE_RESPONSE=$(curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -d "$ISSUE_JSON" "https://api.github.com/repos/${{ github.repository }}/issues")
          ISSUE_NUMBER=$(echo $ISSUE_RESPONSE | jq -r '.number')
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -d "$BODY_JSON" "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments"
          
          # النوم لمدة 6 ساعات داخل نفس الخطوة عشان السيرفر لا يغلق
          sleep 21600

      - name: Configure Environment (Linux)
        if: inputs.os_version == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies tightvncserver curl unzip jq
          sudo useradd -m -s /bin/bash yuta || true
          echo "yuta:Yuta@321" | sudo chpasswd
          sudo adduser yuta sudo || true
          echo "yuta ALL=(ALL) NOPASSWD:ALL" | sudo tee -a /etc/sudoers
          sudo -u yuta bash -c "mkdir -p ~/.vnc && echo 'Yuta@321' | vncpasswd -f > ~/.vnc/passwd && chmod 600 ~/.vnc/passwd"
          sudo -u yuta bash -c "vncserver :1 -geometry 1280x720 -depth 24"
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update
          sudo apt-get install -y ngrok

      - name: Start ngrok and Keep Alive (Linux)
        if: inputs.os_version == 'linux'
        shell: bash
        run: |
          ngrok config add-authtoken "3LVg7kzG0ZnbZ577YdVxcFAUDhY_5uMkowqVV9hRLyftvb1Ek"
          ngrok tcp 5901 --region eu --log=stdout > ngrok.log 2>&1 &
          sleep 10
          TUNNEL=$(curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url // empty')
          TUNNEL=$(echo $TUNNEL | sed 's|tcp://||')
          if [ -z "$TUNNEL" ]; then exit 1; fi
          HOST=$(echo $TUNNEL | cut -d':' -f1)
          PORT=$(echo $TUNNEL | cut -d':' -f2)
          BODY=$(printf "===START_DATA===\\nHOST=%s\\nPORT=%s\\nUSER=yuta\\nPASS=Yuta@321\\nTYPE=linux\\n===END_DATA===" "$HOST" "$PORT")
          BODY_JSON=$(jq -n --arg body "$BODY" '{body: $body}')
          ISSUE_TITLE="Server-$GITHUB_RUN_ID"
          ISSUE_JSON=$(jq -n --arg title "$ISSUE_TITLE" '{title: $title, body: "Logs"}')
          ISSUE_RESPONSE=$(curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -d "$ISSUE_JSON" "https://api.github.com/repos/${{ github.repository }}/issues")
          ISSUE_NUMBER=$(echo $ISSUE_RESPONSE | jq -r '.number')
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" -d "$BODY_JSON" "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/comments"
          sleep 21600
